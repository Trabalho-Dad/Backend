name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Nunca cancela um deploy em andamento; execuções são enfileiradas.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) Testes (devem passar antes de qualquer build/publicação)
  # ---------------------------------------------------------------------------
  tests:
    name: Run automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_NAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - ${{ secrets.POSTGRES_PORT }}:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mongodb:
        image: mongo:8.0.13
        env:
          # Devem coincidir com usuário/senha contidos no secret MONGODB_URI.
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: DefaultPassword
        ports:
          # A porta do host deve coincidir com a porta contida no secret MONGODB_URI.
          - 27019:27017
        options: >-
          --health-cmd "mongosh -u mongo -p DefaultPassword --authenticationDatabase admin --quiet --eval 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create database schema
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql \
            --host "$POSTGRES_HOST" \
            --port "$POSTGRES_PORT" \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_NAME" \
            --set ON_ERROR_STOP=1 \
            --file init-db/01-schema.sql

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

  # ---------------------------------------------------------------------------
  # 2) Build e publicação da imagem (só roda se "tests" for bem-sucedido)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push Docker image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CD_DOCKER_USERNAME }}
          password: ${{ secrets.CD_DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.CD_DOCKER_USERNAME }}/sales-api:latest

  # ---------------------------------------------------------------------------
  # 3) Deploy no Render (só roda se a imagem tiver sido publicada)
  # ---------------------------------------------------------------------------
  deploy:
    name: Trigger Render deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger deploy on Render
        env:
          RENDER_SERVICE_ID: ${{ secrets.CD_RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.CD_RENDER_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'