name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Containers temporários: existem apenas durante este job e são
    # destruídos automaticamente pelo GitHub Actions ao final dele.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_NAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - ${{ secrets.POSTGRES_PORT }}:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mongodb:
        image: mongo:8.0.13
        env:
          # Devem coincidir com usuário/senha contidos no secret MONGODB_URI.
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: DefaultPassword
        ports:
          # A porta do host deve coincidir com a porta contida no secret MONGODB_URI.
          - 27019:27017
        options: >-
          --health-cmd "mongosh -u mongo -p DefaultPassword --authenticationDatabase admin --quiet --eval 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O application.yml usa ddl-auto: validate, então as tabelas precisam
      # existir antes dos testes. O schema do projeto é aplicado no container.
      - name: Create database schema
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql \
            --host "$POSTGRES_HOST" \
            --port "$POSTGRES_PORT" \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_NAME" \
            --set ON_ERROR_STOP=1 \
            --file init-db/01-schema.sql

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test