email:
  subject: "Default Subject"
  message: "Default Message"

server:
  port: ${PORT:8080}

cors:
  originPatterns: ${CORS_ORIGIN_PATTERNS:http://localhost:3000}

spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  application:
    name: sales-application

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_NAME:sales_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mongodb:
    authentication-database: admin
    uri: ${MONGODB_URI:mongodb://localhost:27017/sales_db}
    auto-index-creation: true

jwt:
  secret: ${JWT_SECRET:build-only-secret-key-for-testing-purposes-123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

validator:
  token: ${VALIDATOR_API_TOKEN:mock-validator-token}

brevo:
  api:
    key: ${BREVO_API_KEY:mock-brevo-api-key}

  sender:
    email: ${BREVO_SENDER_EMAIL:noreply@example.com}
    name: ${BREVO_SENDER_NAME:Astra Sales}