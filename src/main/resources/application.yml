email:
  subject: "Default Subject"
  message: "Default Message"

server:
  port: ${SALES_API_PORT}

cors:
  originPatterns: ${CORS_ORIGIN_PATTERNS}

spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  application:
    name: sales-application

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_NAME}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  mongodb:
    authentication-database: admin
    uri: ${MONGODB_URI}
    auto-index-creation: true

  brevo:
    api:
      key: ${BREVO_API_KEY}

    sender:
      email: ${BREVO_SENDER_EMAIL}
      name: ${BREVO_SENDER_NAME}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

validator:
  token: ${VALIDATOR_API_TOKEN}